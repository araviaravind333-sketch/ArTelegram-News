name: Daily Reels Audit (10:00 AM IST)

# 04:30 UTC = 10:00 AM IST. The job typically finishes in 2-4 minutes, so the
# action plan lands in Telegram well before the 10:30 AM IST deadline.
# GitHub's scheduler is best-effort and can lag under load, which is why the
# schedule fires at 10:00 rather than 10:25.
on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print the plan in the log instead of sending to Telegram'
        type: boolean
        default: false
      skip_news:
        description: 'Skip the news scan that feeds the 1M-view roadmap'
        type: boolean
        default: false

concurrency:
  group: reels-audit
  cancel-in-progress: false

permissions:
  contents: write   # required to persist the rolling benchmark file

jobs:
  audit:
    name: Audit reels and push the action plan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate configuration
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INSTA_ACCESS_TOKEN: ${{ secrets.INSTA_ACCESS_TOKEN }}
          INSTA_USER_ID: ${{ secrets.INSTA_USER_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python main.py check

      - name: Run reels audit and push to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INSTA_ACCESS_TOKEN: ${{ secrets.INSTA_ACCESS_TOKEN }}
          INSTA_USER_ID: ${{ secrets.INSTA_USER_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TZ: Asia/Kolkata
        run: |
          python main.py audit \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.skip_news && '--no-news' || '' }}

      - name: Commit updated benchmarks
        if: success() && inputs.dry_run != true
        run: |
          if [ ! -f data/benchmarks.json ]; then
            echo "No benchmark file produced; nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/benchmarks.json
          if git diff --staged --quiet; then
            echo "Benchmarks unchanged."
          else
            git commit -m "chore: update reels benchmarks [skip ci]"
            git push
          fi
