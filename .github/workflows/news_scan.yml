name: Full Briefing (.docx)

# The rolling news feed is handled by news_pulse.yml every hour. This
# workflow is the long-form counterpart: one styled Word document covering all
# 8 categories, delivered once each morning at 07:00 IST (01:30 UTC), plus
# on demand for any custom window.
on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      window:
        description: 'Window, e.g. "6h", "24h", "17-09-26 06:00 to now"'
        type: string
        default: '24h'
      dry_run:
        description: 'Build the .docx but do not send it'
        type: boolean
        default: false

concurrency:
  group: news-briefing
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  briefing:
    name: Scan, score and deliver the briefing
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TZ: Asia/Kolkata
        run: |
          python main.py scan \
            --window "${{ inputs.window || '24h' }}" \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Upload briefing as a build artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: virality-briefing-${{ github.run_number }}
          path: output/*.docx
          retention-days: 14
          if-no-files-found: ignore
