name: Telegram Listener (on-demand commands)

# Polls the Bot API for /scan and /audit commands. Each run polls for ~4.3
# minutes and exits, so a fresh run picks up where the last one stopped and
# no job ever idles. GitHub Actions is free for public repositories; on a
# private repo this consumes roughly 2,000 free minutes a month at a 5-minute
# cadence, so widen the cron if you are on the free private tier.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      seconds:
        description: 'How long to poll, in seconds'
        type: string
        default: '260'

concurrency:
  group: telegram-listener
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  listen:
    name: Poll for commands
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Poll Telegram and execute commands
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INSTA_ACCESS_TOKEN: ${{ secrets.INSTA_ACCESS_TOKEN }}
          INSTA_USER_ID: ${{ secrets.INSTA_USER_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TZ: Asia/Kolkata
        run: python main.py listen --seconds "${{ inputs.seconds || '260' }}"
